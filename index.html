<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Magic Spider Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
            touch-action: none;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #111;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Contenedor de la araña mejorado */
        #spider-container {
            position: absolute;
            width: 120px;
            height: 120px;
            z-index: 50;
            display: none;
            pointer-events: none;
            will-change: top, left, transform;
        }

        .spider-shadow {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 70%);
            filter: blur(8px);
            z-index: 49;
        }

        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.9);
            color: white;
            transition: opacity 0.5s;
        }

        .hidden {
            display: none !important;
        }

        .btn-magic {
            background: linear-gradient(145deg, #ff0000, #8b0000);
            padding: 18px 45px;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 25px rgba(255,0,0,0.6);
            cursor: pointer;
            border: 2px solid white;
        }

        @keyframes legWiggle {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(3deg) scale(1.05); }
        }
        
        .leg-group {
            transform-origin: center;
            animation: legWiggle 0.12s infinite;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <div id="spider-container">
        <div class="spider-shadow"></div>
        <svg viewBox="0 0 120 120" style="width: 100%; height: 100%;">
            <defs>
                <radialGradient id="bodyGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#444;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
                </radialGradient>
            </defs>
            
            <g stroke="#050505" stroke-width="5" fill="none" stroke-linecap="round" class="leg-group">
                <!-- Patas Izquierda -->
                <path d="M50,50 L15,15 L5,35" />
                <path d="M50,55 L10,45 L0,60" style="animation-delay: 0.04s"/>
                <path d="M50,60 L10,75 L5,90" />
                <path d="M50,65 L20,105 L30,115" style="animation-delay: 0.08s"/>
                <!-- Patas Derecha -->
                <path d="M70,50 L105,15 L115,35" />
                <path d="M70,55 L110,45 L120,60" style="animation-delay: 0.02s"/>
                <path d="M70,60 L110,75 L115,90" />
                <path d="M70,65 L100,105 L90,115" style="animation-delay: 0.06s"/>
            </g>

            <!-- Cuerpo realzado -->
            <ellipse cx="60" cy="78" rx="20" ry="28" fill="url(#bodyGrad)" />
            <circle cx="60" cy="45" r="15" fill="#000" />
            
            <!-- Marca Viuda Negra -->
            <path d="M54,68 L66,68 L60,78 L66,88 L54,88 L60,78 Z" fill="#ff0000" />
            
            <!-- Brillos -->
            <circle cx="55" cy="40" r="2" fill="white" fill-opacity="0.3" />
        </svg>
    </div>

    <div id="start-screen" class="ui-layer">
        <h1 class="text-3xl font-black mb-4 text-center tracking-tighter">SPIDER AR <span class="text-red-600">PRO</span></h1>
        <p class="mb-8 text-center px-10 opacity-70 text-sm">Asegúrate de estar en un lugar iluminado para que la cámara enfoque bien la mano.</p>
        <button class="btn-magic" onclick="startMagic()">INICIAR TRUCO</button>
    </div>

    <!-- ÁREAS DE ACTIVACIÓN MEJORADAS -->
    <div id="trigger-top" class="fixed top-0 left-0 w-full h-1/4 z-[110] opacity-0 bg-white" onclick="triggerSpider()"></div>
    <div id="trigger-bottom" class="fixed bottom-0 left-0 w-full h-1/4 z-[110] opacity-0 bg-white" onclick="hideSpider()"></div>

    <script>
        const video = document.getElementById('webcam');
        const spider = document.getElementById('spider-container');
        const startScreen = document.getElementById('start-screen');
        
        let spiderActive = false;
        let spiderX = 0;
        let spiderY = 0;
        let targetX = 0;
        let targetY = 0;

        async function startMagic() {
            try {
                const constraints = {
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                startScreen.classList.add('hidden');
                
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
                
                if (navigator.vibrate) navigator.vibrate(50);
            } catch (err) {
                alert("Error: No se pudo acceder a la cámara. Revisa los permisos del navegador.");
            }
        }

        function triggerSpider() {
            if(spiderActive) return;
            
            spiderActive = true;
            spider.style.display = 'block';
            
            // Aparece desde el borde inferior
            spiderX = (window.innerWidth / 2) - 60;
            spiderY = window.innerHeight + 150;
            
            // Destino: centro de la pantalla
            targetX = spiderX;
            targetY = (window.innerHeight / 2) - 60;
            
            updatePosition();
        }

        function hideSpider() {
            spiderActive = false;
            spider.style.display = 'none';
            if (navigator.vibrate) navigator.vibrate([30, 30]);
        }

        function handleMove(e) {
            if (!spiderActive) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            targetX = clientX - 60;
            targetY = clientY - 60;
        }

        document.addEventListener('touchstart', handleMove);
        document.addEventListener('touchmove', (e) => {
            if (spiderActive) e.preventDefault();
            handleMove(e);
        }, { passive: false });

        function updatePosition() {
            if (!spiderActive) return;

            const dx = targetX - spiderX;
            const dy = targetY - spiderY;
            
            if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                spiderX += dx * 0.12;
                spiderY += dy * 0.12;
                
                const angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
                
                spider.style.left = spiderX + 'px';
                spider.style.top = spiderY + 'px';
                spider.style.transform = `rotate(${angle}deg)`;

                if (Math.random() > 0.85 && navigator.vibrate) {
                    navigator.vibrate(10);
                }
            }

            requestAnimationFrame(updatePosition);
        }

        // Evitar que el usuario cierre la app por accidente o abra menús
        window.oncontextmenu = (e) => { e.preventDefault(); return false; };
    </script>
</body>
</html>
