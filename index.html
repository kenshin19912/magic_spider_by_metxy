<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Magic Spider Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
            touch-action: none;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Contenedor de la araña para manejar la sombra separada del cuerpo */
        #spider-container {
            position: absolute;
            width: 100px;
            height: 100px;
            z-index: 5;
            display: none;
            pointer-events: none;
            transition: transform 0.2s ease-out;
            will-change: top, left, transform;
        }

        /* Sombra proyectada para realismo 3D */
        .spider-shadow {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 70%);
            filter: blur(5px);
            z-index: 4;
        }

        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            color: white;
            transition: opacity 0.5s;
        }

        .hidden {
            display: none !important;
        }

        .btn-magic {
            background: linear-gradient(145deg, #ff0000, #8b0000);
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(255,0,0,0.5);
            cursor: pointer;
            border: 2px solid white;
        }

        /* Animación de patas más orgánica */
        @keyframes legWiggle {
            0%, 100% { transform: scaleY(1) translateX(0); }
            50% { transform: scaleY(1.1) translateX(2px); }
        }
        
        .leg-group {
            transform-origin: center;
            animation: legWiggle 0.15s infinite;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <div id="spider-container">
        <div class="spider-shadow"></div>
        <svg viewBox="0 0 120 120" id="spider-svg">
            <defs>
                <radialGradient id="bodyGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#050505;stop-opacity:1" />
                </radialGradient>
                <filter id="fuzz">
                    <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
                </filter>
            </defs>
            
            <!-- Patas Articuladas -->
            <g stroke="#0a0a0a" stroke-width="4" fill="none" stroke-linecap="round" class="leg-group">
                <!-- Izquierda -->
                <path d="M50,50 L20,20 L10,40" />
                <path d="M50,55 L15,45 L5,65" style="animation-delay: 0.05s"/>
                <path d="M50,60 L15,75 L10,95" />
                <path d="M50,65 L25,100 L35,115" style="animation-delay: 0.07s"/>
                
                <!-- Derecha -->
                <path d="M70,50 L100,20 L110,40" />
                <path d="M70,55 L105,45 L115,65" style="animation-delay: 0.03s"/>
                <path d="M70,60 L105,75 L110,95" />
                <path d="M70,65 L95,100 L85,115" style="animation-delay: 0.06s"/>
            </g>

            <!-- Abdomen (Cuerpo trasero) -->
            <ellipse cx="60" cy="75" rx="18" ry="25" fill="url(#bodyGrad)" filter="url(#fuzz)" />
            
            <!-- Cefalotórax (Cabeza/Cuerpo delantero) -->
            <circle cx="60" cy="45" r="14" fill="#000" filter="url(#fuzz)" />
            
            <!-- Marca Reloj de Arena (Viuda Negra Realista) -->
            <path d="M54,65 L66,65 L60,75 L66,85 L54,85 L60,75 Z" fill="#b30000" style="opacity: 0.9" />
            
            <!-- Brillo en el cuerpo -->
            <ellipse cx="55" cy="40" rx="3" ry="5" fill="white" fill-opacity="0.2" />
        </svg>
    </div>

    <div id="start-screen" class="ui-layer">
        <h1 class="text-3xl font-bold mb-4 text-center">SPIDER AR <br><span class="text-red-600 font-black">PRO</span></h1>
        <p class="mb-8 text-center px-8 opacity-80">Efecto visual de alta fidelidad para magia de cerca.</p>
        <button class="btn-magic" onclick="startMagic()">ACTIVAR CÁMARA</button>
    </div>

    <div class="fixed top-0 left-0 w-full h-24 z-30 opacity-0" onclick="triggerSpider()"></div>
    <div class="fixed bottom-0 left-0 w-full h-24 z-30 opacity-0" onclick="hideSpider()"></div>

    <script>
        const video = document.getElementById('webcam');
        const spider = document.getElementById('spider-container');
        const startScreen = document.getElementById('start-screen');
        
        let spiderActive = false;
        let spiderX = 0;
        let spiderY = 0;
        let targetX = 0;
        let targetY = 0;

        async function startMagic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }, 
                    audio: false 
                });
                video.srcObject = stream;
                startScreen.classList.add('hidden');
                
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
                
                if (navigator.vibrate) navigator.vibrate([10, 30]);
                
            } catch (err) {
                alert("Permite el acceso a la cámara.");
            }
        }

        function triggerSpider() {
            if(spiderActive) return;
            spiderActive = true;
            spider.style.display = 'block';
            
            spiderX = window.innerWidth / 2 - 50;
            spiderY = window.innerHeight + 120;
            targetX = spiderX;
            targetY = window.innerHeight / 2;
            
            updatePosition();
        }

        function hideSpider() {
            spiderActive = false;
            spider.style.display = 'none';
            if (navigator.vibrate) navigator.vibrate(40);
        }

        const handleInteraction = (e) => {
            if (!spiderActive) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            targetX = clientX - 50;
            targetY = clientY - 50;
        };

        document.addEventListener('touchstart', handleInteraction);
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleInteraction(e);
        }, { passive: false });

        function updatePosition() {
            if (!spiderActive) return;

            const dx = targetX - spiderX;
            const dy = targetY - spiderY;
            
            if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                spiderX += dx * 0.15;
                spiderY += dy * 0.15;
                
                const angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
                
                spider.style.left = spiderX + 'px';
                spider.style.top = spiderY + 'px';
                spider.style.transform = `rotate(${angle}deg)`;

                if (Math.random() > 0.8 && navigator.vibrate) {
                    navigator.vibrate(12);
                }
            }

            if (spiderActive) {
                requestAnimationFrame(updatePosition);
            }
        }

        window.oncontextmenu = (e) => { e.preventDefault(); return false; };
    </script>
</body>
</html>
