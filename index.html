<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Magic Spider Modern PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
            touch-action: none;
        }

        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #photo-canvas {
            z-index: 2;
            display: none;
        }

        /* Araña con realismo mejorado */
        #spider-wrapper {
            position: absolute;
            width: 140px;
            height: 140px;
            z-index: 50;
            display: none;
            pointer-events: none;
            will-change: transform, top, left;
        }

        .spider-shadow {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 80%);
            filter: blur(12px);
            z-index: 49;
            transform: scale(1.4);
        }

        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            color: white;
            transition: opacity 0.5s;
        }

        .hidden { display: none !important; }

        .btn-capture {
            background: #fff;
            color: #000;
            padding: 22px 50px;
            border-radius: 60px;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 0 40px rgba(255,255,255,0.2);
            cursor: pointer;
            border: none;
            letter-spacing: 2px;
        }

        /* Animación de patas naturales */
        @keyframes crawl {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(3deg) scale(1.02); }
        }
        
        .walking .leg-group-a { animation: crawl 0.18s infinite ease-in-out; }
        .walking .leg-group-b { animation: crawl 0.18s infinite ease-in-out reverse; }
        
        #spider-svg {
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Cámara en vivo -->
        <video id="webcam" autoplay playsinline muted></video>
        <!-- Foto fija -->
        <canvas id="photo-canvas"></canvas>

        <!-- La Araña -->
        <div id="spider-wrapper">
            <div class="spider-shadow"></div>
            <svg viewBox="0 0 120 120" id="spider-svg" class="walking">
                <defs>
                    <radialGradient id="gradBody" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" style="stop-color:#444" />
                        <stop offset="100%" style="stop-color:#020202" />
                    </radialGradient>
                    <radialGradient id="gradHead" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#222" />
                        <stop offset="100%" style="stop-color:#000" />
                    </radialGradient>
                </defs>
                
                <!-- Patas con articulaciones (Diseño más orgánico) -->
                <g stroke="#050505" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <g class="leg-group-a">
                        <path d="M52,48 L15,10 L5,25" /> <!-- Sup Izq -->
                        <path d="M68,48 L105,10 L115,25" /> <!-- Sup Der -->
                        <path d="M52,65 L10,85 L2,105" /> <!-- Inf Izq -->
                        <path d="M68,65 L110,85 L118,105" /> <!-- Inf Der -->
                    </g>
                    <g class="leg-group-b">
                        <path d="M52,55 L8,48 L2,68" /> <!-- Med Sup Izq -->
                        <path d="M68,55 L112,48 L118,68" /> <!-- Med Sup Der -->
                        <path d="M52,62 L15,90 L28,115" /> <!-- Med Inf Izq -->
                        <path d="M68,62 L105,90 L92,115" /> <!-- Med Inf Der -->
                    </g>
                </g>

                <!-- Cuerpo -->
                <ellipse cx="60" cy="82" rx="24" ry="32" fill="url(#gradBody)" /> <!-- Abdomen -->
                <circle cx="60" cy="48" r="17" fill="url(#gradHead)" /> <!-- Cabeza -->
                
                <!-- Marca Roja (Viuda Negra) - Más sutil -->
                <path d="M55,75 L65,75 L60,84 L65,93 L55,93 L60,84 Z" fill="#900" opacity="0.8" />
                
                <!-- Brillos realistas -->
                <ellipse cx="54" cy="42" rx="2" ry="3" fill="white" fill-opacity="0.2" />
                <ellipse cx="66" cy="42" rx="2" ry="3" fill="white" fill-opacity="0.2" />
            </g>
        </div>
    </div>

    <!-- UI Inicial -->
    <div id="start-screen" class="ui-layer">
        <h1 class="text-3xl font-black mb-6 tracking-[0.2em] text-white">SPIDER SENSOR</h1>
        <div class="w-16 h-1 bg-red-600 mb-8"></div>
        <p class="mb-10 text-center px-12 opacity-70 text-xs leading-relaxed uppercase tracking-widest">
            Calibrando sensor térmico... <br>Pide al espectador que mantenga la mano inmóvil.
        </p>
        <button class="btn-capture" id="btn-action">TOMAR FOTO</button>
    </div>

    <!-- Trigger invisible -->
    <div id="proximity-fallback" class="fixed top-0 left-0 w-full h-1/3 z-[110] hidden"></div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('photo-canvas');
        const spider = document.getElementById('spider-wrapper');
        const startScreen = document.getElementById('start-screen');
        const fallback = document.getElementById('proximity-fallback');
        const btnAction = document.getElementById('btn-action');
        
        let magicTriggered = false;

        // Iniciar cámara con manejo de errores mejorado
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false 
                });
                video.srcObject = stream;
                // Esperar a que el video esté listo
                await video.play();
            } catch (err) {
                console.error("Error cámara:", err);
                // Reintentar una vez con parámetros mínimos si hay error
                if (err.name === 'TimeoutError' || err.name === 'AbortError') {
                    setTimeout(initCamera, 1000);
                }
            }
        }

        // Ejecutar al cargar
        window.addEventListener('load', initCamera);

        btnAction.addEventListener('click', takePhoto);

        function takePhoto() {
            if (video.readyState !== 4) return; // Video not ready

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Captura instantánea
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.style.display = 'block';
            video.style.display = 'none';
            startScreen.classList.add('hidden');
            
            // Activar zona de proximidad
            fallback.classList.remove('hidden');

            // Fallback táctil o proximidad
            const triggerAction = () => startMagicSequence();
            fallback.addEventListener('touchstart', triggerAction);
            fallback.addEventListener('mouseenter', triggerAction);
        }

        function startMagicSequence() {
            if (magicTriggered) return;
            magicTriggered = true;
            fallback.classList.add('hidden');

            spider.style.display = 'block';
            
            let x = (window.innerWidth / 2) - 70;
            let y = window.innerHeight + 150;
            spider.style.left = x + 'px';
            spider.style.top = y + 'px';

            // SECUENCIA DE MOVIMIENTO
            // 1. Sube al centro con velocidad variable
            moveSpider(y, window.innerHeight / 2 - 70, 2800, () => {
                // 2. Pausa con vibración
                if (navigator.vibrate) navigator.vibrate([100, 30, 100]);
                document.getElementById('spider-svg').classList.remove('walking');
                
                setTimeout(() => {
                    // 3. Gira y escapa
                    document.getElementById('spider-svg').classList.add('walking');
                    document.getElementById('spider-svg').style.transform = "rotate(180deg)";
                    
                    moveSpider(window.innerHeight / 2 - 70, window.innerHeight + 250, 1200, () => {
                        spider.style.display = 'none';
                    });
                }, 2200);
            });
        }

        function moveSpider(fromY, toY, duration, callback) {
            let start = null;
            function step(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let t = Math.min(progress / duration, 1);
                
                // Ease out para que se vea más natural
                let ease = t * (2 - t);
                let currentY = fromY + (toY - fromY) * ease;
                
                // Vaivén lateral orgánico
                let sway = Math.sin(progress / 120) * 8;
                
                spider.style.top = currentY + 'px';
                spider.style.left = ((window.innerWidth / 2) - 70 + sway) + 'px';

                if (progress < duration) {
                    if (navigator.vibrate && Math.random() > 0.85) navigator.vibrate(8);
                    requestAnimationFrame(step);
                } else if (callback) {
                    callback();
                }
            }
            requestAnimationFrame(step);
        }

        // Bloqueos para evitar salir del modo pantalla completa o abrir menús
        window.oncontextmenu = (e) => { e.preventDefault(); return false; };
        document.addEventListener('touchmove', (e) => {
            if(magicTriggered) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
